name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: node --test "viewer/**/*.test.js"
      - name: Leak check (no team data beyond the example team)
        run: python scripts/leak_check.py
      - name: Build the team template and check it
        run: |
          python scripts/make_template.py
          python scripts/leak_check.py --root dist/team-template
